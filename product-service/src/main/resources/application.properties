spring.application.name=product-service
server.port=8080

# ========== DATABASE ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/productdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ========== REDIS CACHE ==========
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
# TTL cho cache "products": 30 phút -> sản phẩm ít được xem sẽ tự hết hạn, Redis không bị đầy
app.cache.products-ttl=30m

# Mô phỏng độ trễ DB thực tế khi hệ thống tải cao (ms). Đặt 0 để đo tốc độ DB thật.
app.simulate-db-latency-ms=200

logging.level.org.springframework.cache=TRACE
